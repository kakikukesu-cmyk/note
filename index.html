<body>

    <h1>数学ノート</h1>

    <p>局所化について：</p>

    <p>
        例えば、局所環
        \(\mathbb{Z}_{(2)}\)
        を考えることができます。
    </p>

    <p>これは次のように表されます：</p>

    \[
    \mathbb{Z}_{(2)}
    =
    \left\{
        \frac{a}{b}
        \mid
        a\in\mathbb{Z},\ b\notin(2)
    \right\}
    \]
